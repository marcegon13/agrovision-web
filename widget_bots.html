<!-- ===== AGROBOTS WIDGET FLOTANTE ===== -->
<style id="agrobots-styles">
/* ---- Contenedor raíz ---- */
#agrobots-widget{position:fixed;bottom:24px;right:24px;z-index:9000;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-family:'Space Grotesk','Rajdhani',sans-serif;}

/* ---- Botones trigger ---- */
#agrobots-triggers{display:flex;gap:10px;}
.agrobot-btn{width:56px;height:56px;border-radius:50%;border:2px solid var(--g400);background:var(--g950);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 20px rgba(10,31,20,.8);transition:transform .2s,box-shadow .2s;overflow:hidden;}
.agrobot-btn:hover{transform:scale(1.09);box-shadow:0 6px 28px rgba(74,155,106,.5);}
.agrobot-btn.active-bot{border-color:var(--g400);box-shadow:0 0 0 3px rgba(74,155,106,.3),0 6px 28px rgba(74,155,106,.45);}

/* ---- Panel ---- */
#agrobots-panel{width:310px;background:linear-gradient(160deg,#0f2a1c 0%,var(--g950) 100%);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.65);display:none;flex-direction:column;transform-origin:bottom right;}
#agrobots-panel.open{display:flex;animation:botPanelIn .22s ease-out;}
@keyframes botPanelIn{from{opacity:0;transform:scale(.94) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* ---- Header del panel ---- */
#bot-ph{background:var(--g800);padding:11px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
#bot-ph-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:.07em;color:var(--g100);flex:1;}
#bot-ph-badge{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:rgba(74,155,106,.12);border:1px solid var(--g400);color:var(--g400);}
/* Botón app — cambiar display:none a display:block para activar en demo */
#btn-abrir-app{display:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--brick);color:#fff;border:none;cursor:pointer;text-decoration:none;white-space:nowrap;}
#btn-cerrar-panel{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
#btn-cerrar-panel:hover{background:rgba(255,255,255,.08);}

/* ---- Avatar area ---- */
#bot-avatar-area{display:flex;justify-content:center;padding:14px 0 6px;position:relative;}
.bot-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(74,155,106,.12) 0%,transparent 70%);transition:opacity .4s;opacity:.5;}
.bot-glow.speaking{opacity:1;animation:botGlowPulse 1.2s ease-in-out infinite;}
@keyframes botGlowPulse{0%,100%{opacity:.7;}50%{opacity:1;}}

/* ---- Burbuja ---- */
#bot-bubble{margin:0 14px 10px;padding:11px 13px;background:rgba(74,155,106,.07);border:1px solid rgba(74,155,106,.22);border-radius:12px;min-height:52px;}
#bot-bubble-text{font-size:12.5px;line-height:1.55;color:var(--g100);margin:0;}
#bot-bubble-footer{display:flex;align-items:center;gap:6px;margin:6px 0 0;}
.bot-status-dot{width:6px;height:6px;border-radius:50%;background:var(--g400);flex-shrink:0;transition:background .2s;}
.bot-status-dot.talking{background:#FFC933;animation:botDotPing .8s ease-in-out infinite;}
@keyframes botDotPing{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:.5;}}
#bot-status-lbl{font-size:10px;color:var(--text3);font-family:monospace;}

/* ---- Input ---- */
#bot-input-row{display:flex;gap:8px;padding:0 14px 14px;}
#bot-input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--g100);outline:none;font-family:inherit;transition:border-color .15s;}
#bot-input::placeholder{color:var(--text3);}
#bot-input:focus{border-color:var(--g400);}
#bot-send{width:36px;height:36px;border-radius:10px;background:var(--g600);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
#bot-send:hover{background:var(--g400);}

/* ---- Animaciones SARA ---- */
@keyframes swFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes swRadarL{0%,100%{opacity:.35;transform:scale(.96) translateX(0);}50%{opacity:1;transform:scale(1.04) translateX(-2px);}}
@keyframes swRadarR{0%,100%{opacity:.3;transform:scaleX(.9);}50%{opacity:1;transform:scaleX(1.1);}}
@keyframes swSparkle{0%,100%{opacity:.2;transform:scale(.85);}50%{opacity:1;transform:scale(1.2);}}

#sw-svg .sw-float{animation:swFloat 4.5s ease-in-out infinite;}
#sw-svg .sw-radar-l{transform-origin:right center;animation:swRadarL 2s ease-in-out infinite;}
#sw-svg .sw-radar-r{transform-origin:left center;animation:swRadarR 1.6s ease-in-out infinite;}
#sw-svg .sw-sparkle{animation:swSparkle 2.5s ease-in-out infinite;}
</style>

<!-- ===== JS DEL WIDGET ===== -->
<script>
(function(){
  // ─── BASE DE CONOCIMIENTO ──────────────────────────────────────────────────
  // Agregá más objetos {keys:[...], answer:'...'} según las preguntas y respuestas que uses
  const QA = {
    sara:[
      {keys:['humedad','suelo','riego','lote','agua','regar','irrigar','goteo','lámina','lamina','maíz','maiz','cultivo','seco','seca','estrés','estres'],
       answer:'La humedad útil en los primeros 40 cm está en 42%, ingresando a umbral de estrés moderado. Te sugiero iniciar el riego por goteo mañana temprano con una lámina de 18 mm.'},
      {keys:['hola','buenas','buenas tardes','buenas noches','holi','hey','ey','buen día','buen dia'],
       answer:'Hola! Soy SARA, tu asesora de cultivos y suelo. Preguntame sobre humedad, riego o estado de los lotes.'},
      {keys:['temperatura','temp','clima','pronóstico','pronostico','calor','frío','frio'],
       answer:'La temperatura máxima prevista para mañana es de 31°C con humedad relativa del 58%. Condiciones aptas para el riego temprano.'},
    ]
  };

  const FALLBACK = {
    sara:'Para esa consulta necesito los datos del sensor. ¿De qué cultivo y sector me hablás?'
  };

  function matchQA(bot, text){
    const n = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const q = n(text);
    for(const p of QA[bot]){ if(p.keys.some(k=>q.includes(n(k)))) return p.answer; }
    return FALLBACK[bot];
  }

  // ─── REFS ──────────────────────────────────────────────────────────────────
  const panel    = document.getElementById('agrobots-panel');
  const btnS     = document.getElementById('btn-trigger-sara');
  const btnX     = document.getElementById('btn-cerrar-panel');
  const phName   = document.getElementById('bot-ph-name');
  const phBadge  = document.getElementById('bot-ph-badge');
  const bubble   = document.getElementById('bot-bubble-text');
  const sdot     = document.getElementById('bot-sdot');
  const slbl     = document.getElementById('bot-status-lbl');
  const input    = document.getElementById('bot-input');
  const sendBtn  = document.getElementById('bot-send');
  const glow     = document.getElementById('bot-glow');
  const swSvg    = document.getElementById('sw-svg');
  const swMouth  = document.getElementById('sw-mouth');
  const swEL     = document.getElementById('sw-eye-l');
  const swER     = document.getElementById('sw-eye-r');

  // ─── STATE ─────────────────────────────────────────────────────────────────
  let bot='sara', talking=false, mouthIv=null, voice=null;

  // ─── VOCES ─────────────────────────────────────────────────────────────────
  function loadVoice(){
    if(!window.speechSynthesis) return;
    const vv = speechSynthesis.getVoices();
    voice = vv.find(v=>v.lang.startsWith('es-AR'))||vv.find(v=>v.lang.startsWith('es-MX'))||vv.find(v=>v.lang.startsWith('es'))||vv[0];
  }
  if(window.speechSynthesis){ speechSynthesis.onvoiceschanged=loadVoice; loadVoice(); }

  // ─── LIPSYNC DATA ──────────────────────────────────────────────────────────
  const swShapes=[
    'M105 122 C105 135,135 135,135 122',
    'M108 120 C108 138,132 138,132 120',
    'M103 124 C112 130,128 130,137 124',
    'M112 121 C112 131,128 131,128 121',
    'M106 122 C110 134,130 134,134 122'
  ];

  // ─── SARA BLINK ────────────────────────────────────────────────────────────
  setInterval(()=>{
    if(talking||bot!=='sara') return;
    swEL.setAttribute('ry','1.5'); swER.setAttribute('ry','1.5');
    setTimeout(()=>{swEL.setAttribute('ry','9');swER.setAttribute('ry','9');},150);
  },3800);

  // ─── SWITCH BOT ────────────────────────────────────────────────────────────
  function switchBot(){
    if(talking) stopTalk();
    bot='sara';
    swSvg.style.display='';
    phName.textContent='SARA IA';
    phBadge.textContent='Cultivos';
    input.placeholder='Preguntale sobre los lotes...';
    bubble.textContent='¿Querés saber sobre humedad, riego o tus lotes?';
    btnS.classList.add('active-bot');
  }

  // ─── PANEL ─────────────────────────────────────────────────────────────────
  function openPanel(){ panel.classList.add('open'); switchBot(); input.focus(); }
  function closePanel(){ if(talking) stopTalk(); panel.classList.remove('open'); btnS.classList.remove('active-bot'); }

  btnS.addEventListener('click',()=>{ panel.classList.contains('open')?closePanel():openPanel(); });
  btnX.addEventListener('click',closePanel);

  // ─── TALKING STATE ─────────────────────────────────────────────────────────
  function startTalk(){
    talking=true; glow.classList.add('speaking');
    sdot.classList.add('talking'); slbl.textContent='Respondiendo...';
    let s=0; mouthIv=setInterval(()=>{ s=(s+1)%swShapes.length; swMouth.setAttribute('d',swShapes[s]); const ry=(8.5+Math.random()*2).toFixed(1); swEL.setAttribute('ry',ry); swER.setAttribute('ry',ry); },110);
  }

  function stopTalk(){
    talking=false; clearInterval(mouthIv); glow.classList.remove('speaking');
    sdot.classList.remove('talking'); slbl.textContent='Listo';
    swMouth.setAttribute('d','M105 122 C105 135,135 135,135 122');
    swEL.setAttribute('ry','9'); swER.setAttribute('ry','9');
  }

  // ─── SPEAK ─────────────────────────────────────────────────────────────────
  function speak(text){
    if(talking){ stopTalk(); speechSynthesis?.cancel(); return; }
    bubble.textContent=text; startTalk();
    if(!window.speechSynthesis){ setTimeout(stopTalk,4500); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='es-ES'; u.rate=1.02; u.pitch=1.15;
    if(voice) u.voice=voice;
    u.onend=stopTalk; u.onerror=stopTalk;
    speechSynthesis.speak(u);
  }

  // ─── SEND ──────────────────────────────────────────────────────────────────
  function handleSend(){ const q=input.value.trim(); if(!q) return; input.value=''; speak(matchQA(bot,q)); }
  sendBtn.addEventListener('click',handleSend);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') handleSend(); });
})();
</script>
